<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Reel — Kviz: 4 laži i 1 istina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Lora:ital,wght@1,500;1,600&display=block" rel="stylesheet">
<style>
  :root{--ivory:#F6F1E8;--gold:#D6B67C;--red:#D2533F;--graphite:#16140F;--g2:#1E1B16}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#0c0b09}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Poppins,sans-serif;color:var(--ivory);
    background:radial-gradient(1300px 1100px at 50% 45%,var(--g2),var(--graphite) 72%)}
  #glow1,#glow2{position:absolute;border-radius:50%;filter:blur(40px);pointer-events:none}
  #glow1{width:1300px;height:1100px;background:radial-gradient(closest-side,rgba(120,32,28,.6),transparent)}
  #glow2{width:1000px;height:900px;background:radial-gradient(closest-side,rgba(170,110,45,.26),transparent)}
  #grain{position:absolute;inset:0;width:1080px;height:1920px;opacity:.16;mix-blend-mode:overlay;pointer-events:none;z-index:20}
  #vig{position:absolute;inset:0;pointer-events:none;z-index:19;background:radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(0,0,0,.66) 100%)}
  #flash{position:absolute;inset:0;opacity:0;z-index:30;pointer-events:none;mix-blend-mode:screen}
  .frame{position:absolute;inset:44px;border:1.5px solid rgba(214,182,124,.40);z-index:21;pointer-events:none}
  .c{position:absolute;width:52px;height:52px;border:0 solid var(--gold)}
  .c.tl{top:-4px;left:-4px;border-top-width:4px;border-left-width:4px}
  .c.tr{top:-4px;right:-4px;border-top-width:4px;border-right-width:4px}
  .c.bl{bottom:-4px;left:-4px;border-bottom-width:4px;border-left-width:4px}
  .c.br{bottom:-4px;right:-4px;border-bottom-width:4px;border-right-width:4px}
  #brand{position:absolute;top:120px;left:0;right:0;text-align:center;font-weight:600;font-size:26px;letter-spacing:.36em;color:var(--gold);z-index:22}
  #bar{position:absolute;top:44px;left:44px;height:5px;background:var(--gold);z-index:23}

  /* score tracker */
  #dots{position:absolute;top:400px;left:0;right:0;display:flex;justify-content:center;gap:26px;z-index:22;opacity:0}
  .dot{width:58px;height:58px;border-radius:50%;border:3px solid rgba(214,182,124,.45);display:grid;place-items:center;
    font-weight:700;font-size:26px;color:rgba(246,241,232,.55)}
  .dot.cur{border-color:var(--gold);color:var(--ivory);box-shadow:0 0 24px rgba(214,182,124,.45)}
  .dot.mit{background:var(--red);border-color:var(--red);color:#fff}
  .dot.ist{background:var(--gold);border-color:var(--gold);color:var(--graphite)}

  .scene{position:absolute;left:96px;right:96px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;opacity:0;padding:520px 0 470px;z-index:10}
  .ln{overflow:hidden;padding:6px 0 12px;margin:-6px 0 -12px}
  .ln>span{display:block}
  .label{font-weight:600;font-size:30px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:34px}
  .h{font-weight:800;font-size:112px;line-height:1.02;letter-spacing:-.03em}
  .h .g{color:var(--gold)} .h .r{color:var(--red)}
  .st{font-weight:800;font-size:84px;line-height:1.08;letter-spacing:-.025em;text-wrap:balance}
  .sub{font-weight:500;font-size:50px;line-height:1.3;color:rgba(246,241,232,.9);margin-top:40px}
  em{font-family:Lora,serif;font-style:italic;font-weight:600;color:var(--gold)}
  .q{display:flex;align-items:center;gap:30px;margin-top:56px;height:150px}
  .ring{position:relative;width:140px;height:140px;flex:none}
  .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:64px;color:var(--ivory)}
  .q .ask{font-weight:700;font-size:44px;letter-spacing:.02em;color:rgba(246,241,232,.85)}
  .q .ask b{color:var(--red)} .q .ask i{font-style:normal;color:var(--gold)}
  .stamp{position:absolute;left:0;top:-6px;font-weight:900;font-size:120px;letter-spacing:.06em;padding:4px 36px 10px;border:9px solid;border-radius:14px;
    transform-origin:30% 50%;opacity:0}
  .stamp.mit{color:var(--red);border-color:var(--red)}
  .stamp.ist{color:var(--gold);border-color:var(--gold)}
  .why{font-weight:600;font-size:48px;line-height:1.28;color:var(--ivory);margin-top:52px}
  .why em{font-weight:600}
  .ansrow{position:relative;height:170px;margin-top:56px}
  .small{font-weight:500;font-size:34px;color:rgba(246,241,232,.62);margin-top:56px;line-height:1.5}
  .slogan{font-family:Lora,serif;font-style:italic;font-size:48px;color:var(--gold);margin-top:22px}
  .kwbox{display:inline-block;background:var(--gold);color:var(--graphite);padding:0 24px 8px;border-radius:8px}
</style>
</head>
<body>
<div id="stage">
  <div id="glow1"></div><div id="glow2"></div>
  <div id="dots"></div>
  <div id="scenes"></div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="vig"></div>
  <div class="frame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div>
  <div id="brand">FITNESS CLUB ADIN</div>
  <div id="bar"></div>
  <div id="flash"></div>
</div>
<script>
// ---------- SADRŽAJ ----------
const ITEMS = [
  {s:'Što se više znojiš, više sala topiš.', a:'mit', w:'Znoj samo hladi tijelo. <em>Ne mjeri trud.</em>'},
  {s:'Da napreduješ, moraš trenirati svaki dan.', a:'mit', w:'Mišić raste dok se odmaraš. <em>3 dana sedmično</em> su odličan start.'},
  {s:'Trbušnjacima skidaš salo sa stomaka.', a:'mit', w:'Tijelo ne bira odakle troši salo. <em>Cijelo tijelo radi.</em>'},
  {s:'Ako sutra ne boli, trening nije valjao.', a:'mit', w:'Upala nije mjera napretka. <em>Napredak jeste.</em>'},
  {s:'Za tegove nikad nije kasno.', a:'ist', w:'Snaga raste u svakoj dobi. <em>I sa 60. I sa 90.</em>'},
];
const HOOK = 2.6, STEP = 4.6, T0 = HOOK, OUTRO = T0 + ITEMS.length*STEP, DUR = OUTRO + 5.4;
// unutar jedne stavke (sekunde od početka stavke)
const CD0 = 0.45, CD1 = 2.45, REVEAL = 2.45, WHY = 2.85;
window.TIMELINE = {HOOK, STEP, T0, OUTRO, DUR, CD0, CD1, REVEAL, ITEMS: ITEMS.map(i=>i.a)};

const scenes = document.getElementById('scenes');
scenes.insertAdjacentHTML('beforeend', `
  <div class="scene" data-s="0" data-e="${HOOK}">
    <div class="label ln"><span data-in="-1">Kviz · Mit ili istina?</span></div>
    <div class="h ln"><span data-in="-1"><span class="r">4 laži</span> i</span></div>
    <div class="h ln"><span data-in="-1"><span class="g">1 istina</span></span></div>
    <div class="h ln"><span data-in="-1">o teretani.</span></div>
    <div class="sub ln"><span data-in="0.5">Pogodi prije nego se otkrije 👀</span></div>
  </div>`);
ITEMS.forEach((it,i)=>{
  const s = T0 + i*STEP, e = s + STEP;
  scenes.insertAdjacentHTML('beforeend', `
  <div class="scene" data-s="${s}" data-e="${e}" data-item="${i}">
    <div class="label ln"><span data-in="${s}">Tvrdnja ${i+1} / ${ITEMS.length}</span></div>
    <div class="st ln"><span data-in="${s+0.08}">${it.s}</span></div>
    <div class="ansrow">
      <div class="q" data-hide="${s+REVEAL}" style="margin-top:0">
        <div class="ring"><svg width="140" height="140"><circle cx="70" cy="70" r="62" fill="none" stroke="rgba(214,182,124,.2)" stroke-width="8"/>
          <circle class="arc" cx="70" cy="70" r="62" fill="none" stroke="#D6B67C" stroke-width="8" stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="0"/></svg>
          <div class="num">3</div></div>
        <div class="ask"><b>MIT</b> ili <i>ISTINA</i>?</div>
      </div>
      <div class="stamp ${it.a}" data-stamp="${s+REVEAL}">${it.a==='mit'?'MIT':'ISTINA'}</div>
    </div>
    <div class="why ln"><span data-in="${s+WHY}">${it.w}</span></div>
  </div>`);
});
scenes.insertAdjacentHTML('beforeend', `
  <div class="scene" data-s="${OUTRO}" data-e="99">
    <div class="h ln"><span data-in="${OUTRO+0.05}">Koliko si</span></div>
    <div class="h ln"><span data-in="${OUTRO+0.2}"><span class="g">pogodio?</span></span></div>
    <div class="sub ln"><span data-in="${OUTRO+0.6}">Napiši broj u komentar 👇</span></div>
    <div class="sub ln" style="font-size:40px;margin-top:26px"><span data-in="${OUTRO+1.1}">Pitanja? <em>Edin i Kenan</em> odgovaraju.</span></div>
    <div class="small ln"><span data-in="${OUTRO+1.7}">Fitness Club Adin · Stijena, Cazin<br>Svaki dan 16–22h · @fitnesadin</span></div>
    <div class="slogan ln"><span data-in="${OUTRO+2.2}">Jači od jučer.</span></div>
  </div>`);

const dots = document.getElementById('dots');
ITEMS.forEach((_,i)=>dots.insertAdjacentHTML('beforeend',`<div class="dot">${i+1}</div>`));

// ---------- ANIMACIJA ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOut=x=>1-Math.pow(1-x,4);
const backOut=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
let seed=1; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const gc=document.getElementById('grain'), gx=gc.getContext('2d'), gimg=gx.createImageData(540,960);
function grain(frame){seed=1+frame*7919;const d=gimg.data;for(let i=0;i<d.length;i+=4){const v=rnd()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}gx.putImageData(gimg,0,0)}
const sceneEls=[...document.querySelectorAll('.scene')];
const flash=document.getElementById('flash');

function render(t, frame){
  const g1=document.getElementById('glow1'), g2=document.getElementById('glow2');
  g1.style.left=(-520+Math.sin(t*.25)*90)+'px'; g1.style.top=(-420+Math.cos(t*.2)*70)+'px';
  g2.style.left=(420+Math.cos(t*.22)*80)+'px'; g2.style.top=(1250+Math.sin(t*.3)*80)+'px';
  grain(frame);
  document.getElementById('bar').style.width=(992*clamp(t/DUR))+'px';

  // tracker
  const dd=[...dots.children];
  dots.style.opacity = (t>=T0-0.1 && t<OUTRO-0.1) ? clamp((t-(T0-0.1))/0.3) : (t>=OUTRO-0.1 ? 1-clamp((t-(OUTRO-0.1))/0.3) : 0);
  dd.forEach((d,i)=>{
    const s=T0+i*STEP, rev=s+REVEAL;
    d.className='dot'+(t>=rev?(' '+(ITEMS[i].a==='mit'?'mit':'ist')):(t>=s&&t<s+STEP?' cur':''));
  });

  // flash on reveal
  let fl=0, col='';
  ITEMS.forEach((it,i)=>{const r=T0+i*STEP+REVEAL; if(t>=r&&t<r+0.5){const v=0.45*Math.exp(-(t-r)*10); if(v>fl){fl=v; col=it.a}}});
  flash.style.opacity=fl.toFixed(3);
  flash.style.background= col==='ist' ? 'radial-gradient(circle at 50% 55%,#fff3da,#D6B67C 55%,transparent 80%)' : 'radial-gradient(circle at 50% 55%,#ffb3a6,#D2533F 50%,transparent 80%)';

  for(const sc of sceneEls){
    const s=+sc.dataset.s, e=+sc.dataset.e;
    if(t<s-0.01||t>e){sc.style.opacity=0;continue}
    const out=clamp((t-(e-0.2))/0.2);
    const zoom=1+0.02*clamp((t-s)/(Math.min(e,DUR)-s));
    sc.style.opacity=(1-out).toFixed(3);
    sc.style.filter=out>0?`blur(${(out*14).toFixed(1)}px)`:'none';
    sc.style.transform=`scale(${(zoom+out*0.05).toFixed(4)})`;
    for(const sp of sc.querySelectorAll('[data-in]')){
      const ti=+sp.dataset.in, p=easeOut(clamp((t-ti)/0.4));
      sp.style.transform=`translateY(${((1-p)*110).toFixed(2)}%)`;
      sp.style.opacity=t<ti?0:1;
    }
    // countdown
    const q=sc.querySelector('.q');
    if(q){
      const s0=+sc.dataset.s, hide=+q.dataset.hide;
      const qp=easeOut(clamp((t-(s0+CD0-0.2))/0.3));
      q.style.opacity = t>=hide ? 1-clamp((t-hide)/0.12) : qp;
      q.style.transform=`translateY(${((1-qp)*40).toFixed(1)}px)`;
      const c=clamp((t-(s0+CD0))/(CD1-CD0));
      sc.querySelector('.arc').setAttribute('stroke-dashoffset',(389.6*c).toFixed(1));
      sc.querySelector('.num').textContent = String(Math.max(1,3-Math.floor(c*3)));
    }
    const st=sc.querySelector('.stamp');
    if(st){
      const ts=+st.dataset.stamp, p=clamp((t-ts)/0.32);
      st.style.opacity = t<ts?0:clamp(p*3);
      st.style.transform=`rotate(-6deg) scale(${(t<ts?1.6:1.6-0.6*backOut(p)).toFixed(3)})`;
    }
  }
}
window.render=render; window.DUR=DUR;
render(0,0);
</script>
</body>
</html>
