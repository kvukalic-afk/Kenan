<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Karusel — Nove cijene i podrška članova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Lora:ital,wght@1,500;1,600&display=block" rel="stylesheet">
<style>
  :root{--ivory:#F6F1E8;--cream:#EFE6D6;--gold:#D6B67C;--gold-ink:#9C7A3F;--ink:#211D17;--muted:#6B6153}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#ddd;font-family:Poppins,sans-serif;color:var(--ink)}
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;margin-bottom:40px;
    background:
      radial-gradient(900px 700px at 88% 6%, rgba(214,182,124,.30), transparent 62%),
      radial-gradient(800px 700px at 0% 100%, rgba(214,182,124,.18), transparent 60%),
      linear-gradient(160deg,#FAF6EE,var(--ivory) 45%,var(--cream))}
  .tall .slide{height:1920px}
  .slide::before{content:"";position:absolute;inset:-50%;pointer-events:none;z-index:5;opacity:.10;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .33  0 0 0 0 .2  0 0 0 1.2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
  .frame{position:absolute;inset:44px;border:1.5px solid rgba(156,122,63,.45);z-index:6;pointer-events:none}
  .c{position:absolute;width:46px;height:46px;border:0 solid var(--gold-ink)}
  .c.tl{top:-4px;left:-4px;border-top-width:4px;border-left-width:4px}
  .c.tr{top:-4px;right:-4px;border-top-width:4px;border-right-width:4px}
  .c.bl{bottom:-4px;left:-4px;border-bottom-width:4px;border-left-width:4px}
  .c.br{bottom:-4px;right:-4px;border-bottom-width:4px;border-right-width:4px}
  .inner{position:absolute;inset:44px;z-index:7;padding:78px 84px 84px;display:flex;flex-direction:column}
  .tall .inner{padding:300px 84px 470px}
  .top{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:22px;letter-spacing:.32em;color:var(--gold-ink);text-transform:uppercase}
  .tall .top{position:absolute;top:96px;left:84px;right:84px}
  .top .n{letter-spacing:.12em;color:var(--muted);font-weight:500}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center}
  .rule{width:88px;height:3px;background:var(--gold-ink);margin-bottom:44px}
  .label{font-weight:600;font-size:26px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:30px}
  h1{font-weight:800;font-size:90px;line-height:1.04;letter-spacing:-.025em;text-wrap:balance}
  h1.xl{font-size:100px}
  h1.md{font-size:78px}
  h1 .g{color:var(--gold-ink)}
  p.sub{margin-top:42px;font-weight:500;font-size:42px;line-height:1.34;color:#3B342A;text-wrap:pretty}
  em{font-family:Lora,serif;font-style:italic;font-weight:600;color:var(--gold-ink)}
  .prices{margin-top:50px;display:flex;flex-direction:column;gap:24px}
  .price{display:flex;justify-content:space-between;align-items:baseline;padding:34px 40px;background:rgba(255,255,255,.55);
    border:1.5px solid rgba(156,122,63,.35);border-radius:8px}
  .price .what{font-size:40px;font-weight:600}
  .price .what span{display:block;font-size:26px;font-weight:500;color:var(--muted);margin-top:4px}
  .price .amt{font-weight:800;font-size:92px;letter-spacing:-.03em;color:var(--ink);line-height:1}
  .price .amt small{font-size:40px;font-weight:700;margin-left:10px;color:var(--gold-ink);letter-spacing:0}
  .pillars{margin-top:48px;display:grid;grid-template-columns:1fr;gap:22px}
  .pillar{display:flex;gap:30px;align-items:center;font-size:44px;font-weight:700}
  .pillar b{flex:none;width:76px;height:76px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-size:32px;font-weight:700}
  .list{margin-top:40px;display:flex;flex-direction:column;gap:18px}
  .list div{font-size:36px;font-weight:600;line-height:1.25;padding-left:44px;position:relative}
  .list div::before{content:"";position:absolute;left:0;top:.42em;width:20px;height:20px;background:var(--gold-ink);transform:rotate(45deg)}
  .coaches{margin-top:46px;display:flex;gap:22px}
  .coach{flex:1;padding:28px 30px;background:var(--ink);color:var(--ivory);border-radius:8px}
  .coach .role{font-size:22px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .coach .name{font-size:42px;font-weight:800;line-height:1.1;margin-top:10px;letter-spacing:-.01em}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:24px;color:var(--muted);font-weight:500}
  .tall .foot{position:absolute;left:84px;right:84px;bottom:390px}
  .swipe{font-weight:600;color:var(--gold-ink);letter-spacing:.14em;text-transform:uppercase;font-size:24px}
  .swipe b{font-size:34px;margin-left:8px;letter-spacing:0}
  .slogan{font-family:Lora,serif;font-style:italic;font-size:30px;color:var(--gold-ink)}
  .sign{margin-top:54px;padding-top:36px;border-top:1.5px solid rgba(156,122,63,.35);font-size:32px;line-height:1.4;color:#3B342A;font-weight:500}
</style>
</head>
<body>
<div id="root"></div>
<script>
const S=[
 { // 1 HOOK
  html:`<div class="label">Našim članovima</div>
   <h1 class="xl">Godinama smo držali istu cijenu. <span class="g">Zbog vas.</span></h1>
   <p class="sub">Sad vam dugujemo iskrenost – i tražimo vašu <em>podršku.</em></p>`, foot:'swipe'},
 { // 2 NOVE CIJENE
  html:`<div class="label">Nove cijene</div>
   <h1 class="md">Troškovi su rasli. Rastemo i mi.</h1>
   <div class="prices">
     <div class="price"><div class="what">Mjesečna članarina</div><div class="amt">40<small>KM</small></div></div>
     <div class="price"><div class="what">Dnevna karta<span>jedan trening</span></div><div class="amt">4<small>KM</small></div></div>
   </div>`, foot:'swipe'},
 { // 3 GDJE IDE
  html:`<div class="label">Šta dobijate zauzvrat</div>
   <h1 class="md">Nastavljamo ulagati u <em>vas.</em></h1>
   <div class="pillars">
     <div class="pillar"><b>01</b><span>Sprave</span></div>
     <div class="pillar"><b>02</b><span>Ambijent</span></div>
     <div class="pillar"><b>03</b><span>Znanje trenera</span></div>
   </div>
   <p class="sub" style="font-size:36px">…i sve ostalo što čini da vam sala bude <em>drugi dom.</em></p>`, foot:'swipe'},
 { // 4 PAKETI + TRENERI
  html:`<div class="label">Sve na jednom mjestu</div>
   <h1 class="md">Paket za svakoga.</h1>
   <div class="list">
     <div>Nekoliko paketa članarine</div>
     <div>Grupni, individualni i personalni treninzi</div>
     <div>Planovi treninga i ishrane po mjeri</div>
   </div>
   <div class="coaches">
     <div class="coach"><div class="role">Trener</div><div class="name">Edin<br>Hodžić</div></div>
     <div class="coach"><div class="role">Trener</div><div class="name">Kenan<br>Vukalić</div></div>
   </div>`, foot:'swipe'},
 { // 5 HVALA + CTA
  html:`<div class="rule"></div>
   <h1>Hvala što ste uz nas. <span class="g">Zajedno smo jači.</span></h1>
   <p class="sub">Šta da sljedeće poboljšamo u sali? <em>Napišite nam</em> 👇</p>
   <p class="sign">Edin, Kenan i cijela ekipa Fitness Club Adin</p>`, foot:'end'},
];
if(new URLSearchParams(location.search).get('f')==='tall') document.body.classList.add('tall');
const root=document.getElementById('root'), N=S.length;
S.forEach((s,i)=>{
  const foot=s.foot==='swipe'?`<span>@fitnesadin</span><span class="swipe">prevuci<b>»</b></span>`
    :`<span>Fitness Club Adin · Stijena · 16–22h · 060 307 1722</span><span class="slogan">Jači od jučer.</span>`;
  root.insertAdjacentHTML('beforeend',`<section class="slide" id="s${i+1}">
    <div class="frame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div>
    <div class="inner"><div class="top"><span>Fitness Club Adin</span><span class="n">0${i+1} / 0${N}</span></div>
    <div class="body">${s.html}</div><div class="foot">${foot}</div></div></section>`);
});
</script>
</body>
</html>
