<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Reel — Ženski termin 20:30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Lora:ital,wght@1,500;1,600&display=block" rel="stylesheet">
<style>
  :root{--ivory:#F6F1E8;--gold:#D6B67C;--graphite:#16140F;--g2:#1E1B16}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#0c0b09}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Poppins,sans-serif;color:var(--ivory);
    background:radial-gradient(1300px 1100px at 50% 45%,var(--g2),var(--graphite) 72%)}
  #ph{position:absolute;left:0;top:0;background:url(ekipa.jpg) 0 0/100% 100% no-repeat;transform-origin:0 0;
    filter:brightness(.97) contrast(1.06) saturate(1.05) sepia(.08)}
  #phwrap{position:absolute;inset:0;overflow:hidden}
  #shade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(16,14,11,.92) 0%,rgba(16,14,11,.78) 22%,rgba(16,14,11,.15) 40%,rgba(16,14,11,0) 55%,rgba(16,14,11,.2) 78%,rgba(16,14,11,.85) 100%)}
  #end{position:absolute;inset:0;opacity:0;background:
      radial-gradient(900px 700px at 8% 4%, rgba(107,31,28,.55), transparent 62%),
      radial-gradient(1300px 1100px at 50% 45%,var(--g2),var(--graphite) 72%)}
  #grain{position:absolute;inset:0;width:1080px;height:1920px;opacity:.12;mix-blend-mode:overlay;pointer-events:none;z-index:20}
  #vig{position:absolute;inset:0;pointer-events:none;z-index:19;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
  .frame{position:absolute;inset:44px;border:1.5px solid rgba(214,182,124,.45);z-index:21;pointer-events:none}
  .c{position:absolute;width:52px;height:52px;border:0 solid var(--gold)}
  .c.tl{top:-4px;left:-4px;border-top-width:4px;border-left-width:4px}
  .c.tr{top:-4px;right:-4px;border-top-width:4px;border-right-width:4px}
  .c.bl{bottom:-4px;left:-4px;border-bottom-width:4px;border-left-width:4px}
  .c.br{bottom:-4px;right:-4px;border-bottom-width:4px;border-right-width:4px}
  #brand{position:absolute;top:120px;left:0;right:0;text-align:center;font-weight:600;font-size:26px;letter-spacing:.36em;color:var(--gold);z-index:22}
  #bar{position:absolute;top:44px;left:44px;height:5px;background:var(--gold);z-index:23}

  .scene{position:absolute;left:96px;right:96px;opacity:0;z-index:10}
  .scene.top{top:230px}
  .scene.mid{top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;padding:420px 0 470px}
  .ln{overflow:hidden;padding:6px 0 12px;margin:-6px 0 -12px}
  .ln>span{display:block}
  .label{font-weight:600;font-size:30px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:26px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .h{font-weight:800;font-size:108px;line-height:1.02;letter-spacing:-.03em;text-shadow:0 4px 30px rgba(0,0,0,.55)}
  .h.s{font-size:92px}
  .h .g{color:var(--gold)}
  .sub{font-weight:500;font-size:50px;line-height:1.3;color:rgba(246,241,232,.92);margin-top:34px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  em{font-family:Lora,serif;font-style:italic;font-weight:600;color:var(--gold)}
  .days{display:flex;gap:18px;margin-top:30px}
  .day{font-weight:700;font-size:38px;letter-spacing:.1em;padding:14px 30px;border:2.5px solid var(--gold);color:var(--gold);border-radius:60px;background:rgba(16,14,11,.55)}
  .kw{display:inline-block;background:var(--gold);color:var(--graphite);padding:0 24px 8px;border-radius:8px;text-shadow:none}
  .small{font-weight:500;font-size:34px;color:rgba(246,241,232,.65);margin-top:56px;line-height:1.5}
  .slogan{font-family:Lora,serif;font-style:italic;font-size:48px;color:var(--gold);margin-top:22px}
</style>
</head>
<body>
<div id="stage">
  <div id="phwrap"><div id="ph"></div><div id="shade"></div></div>
  <div id="end"></div>
  <div id="scenes">
    <div class="scene top" data-s="0" data-e="3.4">
      <div class="label ln"><span data-in="-1">Ženski termin</span></div>
      <div class="h ln"><span data-in="-1">Ovo je ekipa</span></div>
      <div class="h ln"><span data-in="-1"><span class="g">iz 20:30.</span></span></div>
    </div>
    <div class="scene top" data-s="3.4" data-e="6.8">
      <div class="label ln"><span data-in="3.45">Svake sedmice</span></div>
      <div class="h s ln"><span data-in="3.55">Nedjelja.</span></div>
      <div class="h s ln"><span data-in="3.95">Utorak.</span></div>
      <div class="h s ln"><span data-in="4.35">Četvrtak.</span></div>
    </div>
    <div class="scene top" data-s="6.8" data-e="10.0">
      <div class="h s ln"><span data-in="6.85">Dođeš zbog</span></div>
      <div class="h s ln"><span data-in="7.0">treninga.</span></div>
      <div class="h s ln"><span data-in="7.6"><span class="g">Ostaneš zbog</span></span></div>
      <div class="h s ln"><span data-in="7.75"><span class="g">ekipe.</span></span></div>
    </div>
    <div class="scene mid" data-s="10.0" data-e="99">
      <div class="label ln"><span data-in="10.1">Prvi put?</span></div>
      <div class="h ln"><span data-in="10.2">Povedi</span></div>
      <div class="h ln"><span data-in="10.35"><span class="g">drugaricu.</span></span></div>
      <div class="days ln"><span data-in="10.8" style="display:flex;gap:18px"><span class="day">NED</span><span class="day">UTO</span><span class="day">ČET</span><span class="day" style="background:var(--gold);color:var(--graphite)">20:30</span></span></div>
      <div class="sub ln"><span data-in="11.3">Napiši <span class="kw">TERMIN</span> u poruku.</span></div>
      <div class="small ln"><span data-in="11.9">Fitness Club Adin · Stijena, Cazin<br>060 307 1722 · @fitnesadin</span></div>
      <div class="slogan ln"><span data-in="12.4">Jači od jučer.</span></div>
    </div>
  </div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="vig"></div>
  <div class="frame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div>
  <div id="brand">FITNESS CLUB ADIN</div>
  <div id="bar"></div>
</div>
<script>
const DUR = 15.0, END = 10.0;
const IW = 2200, IH = 1650;            // dimenzije fotografije
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOut=x=>1-Math.pow(1-x,4);
const easeInOut=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
let seed=1; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const gc=document.getElementById('grain'), gx=gc.getContext('2d'), gimg=gx.createImageData(540,960);
function grain(frame){seed=1+frame*7919;const d=gimg.data;for(let i=0;i<d.length;i+=4){const v=rnd()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}gx.putImageData(gimg,0,0)}
const scenes=[...document.querySelectorAll('.scene')];
const ph=document.getElementById('ph');
ph.style.width=IW+'px'; ph.style.height=IH+'px';

// kamera: (centar x u slici, centar y u slici, visina kadra u px slike)
const KEYS=[
  {t:0.0,  x:1050, y:1000, h:1650},   // cijela ekipa
  {t:3.4,  x:620,  y:720,  h:1300},   // lijeva strana (bliže)
  {t:6.8,  x:1560, y:720,  h:1300},   // desna strana
  {t:10.0, x:1100, y:1000, h:1650},   // nazad na sve
];
function cam(t){
  let a=KEYS[0], b=KEYS[KEYS.length-1];
  for(let i=0;i<KEYS.length-1;i++){ if(t>=KEYS[i].t && t<=KEYS[i+1].t){a=KEYS[i];b=KEYS[i+1];break} }
  if(t>KEYS[KEYS.length-1].t){a=b}
  const p= a===b?1: easeInOut(clamp((t-a.t)/(b.t-a.t)));
  return {x:a.x+(b.x-a.x)*p, y:a.y+(b.y-a.y)*p, h:a.h+(b.h-a.h)*p};
}
function render(t, frame){
  grain(frame);
  document.getElementById('bar').style.width=(992*clamp(t/DUR))+'px';
  const c=cam(Math.min(t,END));
  const s=1920/c.h;                       // skala da visina kadra = 1920
  let ox=540 - c.x*s, oy=960 - c.y*s;
  ox=Math.min(0,Math.max(1080-IW*s,ox)); oy=Math.min(0,Math.max(1920-IH*s,oy));
  ph.style.transform=`translate(${ox.toFixed(2)}px,${oy.toFixed(2)}px) scale(${s.toFixed(5)})`;
  const e=clamp((t-(END-0.35))/0.5);
  document.getElementById('end').style.opacity=e.toFixed(3);
  for(const sc of scenes){
    const st=+sc.dataset.s, en=+sc.dataset.e;
    if(t<st-0.01||t>en){sc.style.opacity=0;continue}
    const out=clamp((t-(en-0.22))/0.22);
    sc.style.opacity=(1-out).toFixed(3);
    sc.style.filter=out>0?`blur(${(out*12).toFixed(1)}px)`:'none';
    for(const sp of sc.querySelectorAll('[data-in]')){
      const ti=+sp.dataset.in, p=easeOut(clamp((t-ti)/0.4));
      sp.style.transform=`translateY(${((1-p)*110).toFixed(2)}%)`;
      sp.style.opacity=t<ti?0:1;
    }
  }
}
window.render=render; window.DUR=DUR;
render(0,0);
</script>
</body>
</html>
