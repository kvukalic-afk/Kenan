<!DOCTYPE html>
<html lang="bs">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F0F11">
<title>Adin Šank</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --bg:#0F0F11; --card:#191A1D; --card2:#212227; --line:#2C2D33;
    --gold:#E8A33D; --gold2:rgba(232,163,61,.12); --text:#F5F2EC; --dim:#8F8A80;
    --red:#E5544B; --green:#5FB07A; --blue:#6E8FC4;
    --goldg:linear-gradient(135deg,#F7D58B 0%,#E8A33D 45%,#C9852A 100%);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none; -webkit-text-size-adjust:100%;}
  body{background:radial-gradient(900px 520px at 50% -180px, rgba(232,163,61,.13), transparent 65%) no-repeat, var(--bg); background-attachment:fixed;}
  #root{max-width:560px; margin:0 auto; min-height:100vh;}
  .zl{background:var(--goldg); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .splash{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .hero{display:flex; align-items:center; gap:16px; padding:14px 4px 6px;}
  button{font-family:inherit; cursor:pointer; touch-action:manipulation;}
  input{font-family:inherit;}
  a{color:var(--gold);}
  .head{display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(15,15,17,.92); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); z-index:20;}
  .logo{font-size:12.5px; font-weight:700; letter-spacing:1.9px; white-space:nowrap;}
  .logoSub{font-size:9px; letter-spacing:1.8px; color:var(--dim); margin-top:3px;}
  .wrap{padding:16px 16px 28px; display:flex; flex-direction:column; gap:12px;}
  .h1{font-size:23px; font-weight:700; line-height:1.2;}
  .card{background:linear-gradient(180deg,#1C1D21,#17181B); border:1px solid var(--line); border-radius:14px; padding:16px;}
  .card.racun{border-color:rgba(232,163,61,.45); background:linear-gradient(180deg,rgba(232,163,61,.08),rgba(232,163,61,.02));}
  .card0{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  .lab{font-size:10px; font-weight:600; letter-spacing:2px; color:var(--dim); margin-bottom:8px;}
  .grp{font-size:10px; font-weight:700; letter-spacing:2.2px; color:var(--dim); margin:8px 0 6px 2px;}
  .info{font-size:13px; line-height:1.55; color:var(--dim); background:var(--card);
    border:1px solid var(--line); border-radius:10px; padding:13px;}
  .warn{font-size:13px; line-height:1.55; color:var(--gold); background:rgba(232,163,61,.08);
    border:1px solid rgba(232,163,61,.35); border-radius:10px; padding:13px;}
  .err{font-size:13.5px; line-height:1.55; color:var(--red); background:rgba(229,84,75,.08);
    border:1px solid var(--red); border-radius:10px; padding:13px;}
  .good{font-size:13.5px; line-height:1.55; color:var(--green); background:rgba(95,176,122,.08);
    border:1px solid rgba(95,176,122,.5); border-radius:10px; padding:13px;}
  .sit{font-size:12px; color:var(--dim); margin-top:2px;}
  .btn{width:100%; min-height:56px; margin-top:6px; padding:16px; background:var(--goldg); border:none;
    border-radius:13px; color:#141416; font-size:16px; font-weight:700; letter-spacing:.4px;
    box-shadow:0 8px 22px rgba(232,163,61,.22), inset 0 1px 0 rgba(255,255,255,.35);}
  .btn:active{transform:scale(.985);}
  .btn:disabled{opacity:.35; box-shadow:none;}
  .btn.red{background:var(--red); color:#fff;}
  .btn2{width:100%; min-height:50px; padding:13px; background:transparent;
    border:1px solid var(--line); border-radius:11px; color:var(--dim); font-size:14px; font-weight:500;}
  .pick{flex:1; min-width:96px; min-height:64px; padding:14px 10px; background:var(--card);
    border:1.5px solid var(--line); border-radius:12px; color:var(--text); font-size:18px; font-weight:600;}
  .pick.on{border-color:var(--gold); background:var(--gold2); box-shadow:0 0 0 1px rgba(232,163,61,.25) inset;}
  .chip{min-height:48px; padding:10px 14px; background:var(--card); border:1.5px solid var(--line);
    border-radius:11px; color:var(--text); font-size:14px;}
  .chip.on{border-color:var(--gold); background:var(--gold2);}
  .inp{width:100%; min-height:52px; padding:13px 14px; background:var(--card2); border:1px solid var(--line);
    border-radius:10px; color:var(--text); font-size:17px; outline:none;}
  .inp:focus{border-color:var(--gold);}
  .row{display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 12px 10px 14px; border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row.prazno{background:rgba(232,163,61,.04);}
  .cnt{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .cbtn{width:48px; height:48px; border-radius:11px; background:var(--card2);
    border:1px solid var(--line); color:var(--text); font-size:24px; line-height:1; padding:0;}
  .cin{width:64px; height:48px; padding:0 4px; background:var(--card2); border:1px solid var(--line);
    border-radius:10px; color:var(--text); font-size:20px; font-weight:700; text-align:center; outline:none;}
  .cin:focus{border-color:var(--gold);}
  .cin.prazno{border-color:rgba(232,163,61,.45);}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .tile{position:relative; display:flex; flex-direction:column; align-items:flex-start;
    gap:4px; padding:14px 13px 12px; min-height:92px; background:var(--card);
    border:1.5px solid var(--line); border-radius:13px; color:var(--text);
    text-align:left; user-select:none; -webkit-user-select:none;
    transition:transform .07s ease, border-color .15s ease, background .15s ease;}
  .tile:active{transform:scale(.97);}
  .tile.hit{transform:scale(.95); border-color:var(--gold); background:var(--gold2);}
  .tile .nm{font-size:15.5px; font-weight:600; line-height:1.2;}
  .tile .bot{display:flex; justify-content:space-between; width:100%; align-items:baseline; margin-top:auto;}
  .tile .pr{font-size:13px; color:var(--gold); font-weight:600;}
  .tile .st{font-size:12px; color:var(--dim);}
  .tile .st.low{color:var(--red); font-weight:600;}
  .tile.karta{min-height:104px; background:linear-gradient(160deg,#22211E,#18181B); border-color:rgba(232,163,61,.35);}
  .tile.zlatna{border-color:var(--gold); background:linear-gradient(160deg,rgba(232,163,61,.16),rgba(232,163,61,.03));}
  .tile .ik{font-size:20px; line-height:1; margin-bottom:2px;}
  .badge{position:absolute; top:-8px; right:-6px; min-width:26px; height:26px;
    padding:0 7px; border-radius:13px; background:var(--goldg); box-shadow:0 3px 10px rgba(0,0,0,.4); color:#141416;
    font-size:13px; font-weight:700; display:grid; place-items:center;}
  .undo{position:fixed; left:12px; right:12px; bottom:calc(92px + env(safe-area-inset-bottom)); max-width:536px;
    margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:6px 6px 6px 16px; background:#2A2B31; border:1px solid var(--gold);
    border-radius:12px; font-size:15px; font-weight:500; z-index:30; box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .undo button{min-height:48px; padding:0 16px; background:var(--gold2); border:1px solid var(--gold);
    border-radius:9px; color:var(--gold); font-size:13px; font-weight:700; letter-spacing:1px;}
  .toast{position:fixed; left:12px; right:12px; top:calc(70px + env(safe-area-inset-top)); max-width:536px; margin:0 auto;
    padding:13px 16px; border-radius:11px; font-size:14px; z-index:70; background:#2A2B31;
    border:1px solid var(--line); box-shadow:0 8px 24px rgba(0,0,0,.5); pointer-events:none;}
  .dock{position:fixed; bottom:0; left:0; right:0; max-width:560px; margin:0 auto;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:rgba(25,26,29,.96); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-top:1px solid rgba(232,163,61,.25); z-index:25;}
  .dock .n{font-size:25px; font-weight:700; color:var(--gold); line-height:1.15;}
  .dock .u{font-size:12px; font-weight:400; color:var(--dim); margin-left:4px;}
  .dock button{min-height:54px; padding:0 18px; background:transparent; border:1.5px solid var(--red);
    border-radius:12px; color:var(--text); font-size:14.5px; font-weight:700;}
  .ovl{position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex;
    align-items:flex-end; justify-content:center; z-index:60;}
  .sheet{width:100%; max-width:560px; background:var(--bg);
    border-top:1px solid var(--line); border-radius:18px 18px 0 0;
    padding:16px 16px calc(24px + env(safe-area-inset-bottom));
    max-height:90vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .sync{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--dim); text-align:right; max-width:46%; line-height:1.3;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0;}
  .big{font-size:28px; font-weight:700; line-height:1.15;}
  .two{display:flex; gap:10px;}
  .box{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 14px 16px;}
  .ln{display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:6px 0;}
  .ln b{font-weight:600; text-align:right;}
  .tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
  .tabs button{flex-shrink:0; min-height:44px; padding:0 14px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; color:var(--dim); font-size:13.5px; font-weight:500;}
  .tabs button.on{border-color:var(--gold); color:var(--text); background:var(--gold2);}
  .card.trening{border-color:rgba(232,163,61,.4); background:linear-gradient(160deg,rgba(232,163,61,.10),rgba(232,163,61,.02));}
  .termin{display:flex; gap:12px; padding:9px 0; border-top:1px solid rgba(255,255,255,.06);}
  .termin:first-of-type{border-top:none;}
  .termin .vr{font-size:17px; font-weight:700; color:var(--gold); min-width:52px;}
  .btn2.novo{border-style:dashed; border-color:rgba(232,163,61,.45); color:var(--gold);}
  .linkbtn{background:none; border:none; color:var(--dim); font-size:13px; padding:12px; text-decoration:underline;}
  .listbtn{width:100%; display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:56px;
    padding:10px 14px; background:none; border:none; border-bottom:1px solid var(--line); color:var(--text); text-align:left; font-size:15.5px;}
  .listbtn:last-child{border-bottom:none;}

  /* ── animacije ── */
  @keyframes ulaz{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @keyframes fade{from{opacity:0} to{opacity:1}}
  @keyframes gore{from{transform:translateY(100%)} to{transform:none}}
  @keyframes dole{from{opacity:0; transform:translateY(-14px)} to{opacity:1; transform:none}}
  @keyframes skok{0%{transform:scale(1)} 35%{transform:scale(.93)} 70%{transform:scale(1.03)} 100%{transform:scale(1)}}
  @keyframes val{from{opacity:.55; transform:translate(-50%,-50%) scale(0)} to{opacity:0; transform:translate(-50%,-50%) scale(2.6)}}
  @keyframes bump{0%{transform:scale(.4)} 60%{transform:scale(1.3)} 100%{transform:scale(1)}}
  @keyframes crtaj{from{stroke-dashoffset:var(--d)} to{stroke-dashoffset:0}}
  @keyframes sjaj{0%,100%{box-shadow:0 0 0 0 rgba(95,176,122,0)} 50%{box-shadow:0 0 28px 2px rgba(95,176,122,.35)}}
  @keyframes puls{0%,100%{transform:scale(1); opacity:1} 50%{transform:scale(1.06); opacity:.85}}
  /* samo providnost: transform na .wrap bi "zalijepio" prozore (position:fixed) za dno stranice */
  .wrap{animation:fade .34s ease both;}
  .grid > *{animation:ulaz .38s cubic-bezier(.2,.8,.2,1) both;}
  .grid > *:nth-child(2){animation-delay:.03s} .grid > *:nth-child(3){animation-delay:.06s} .grid > *:nth-child(4){animation-delay:.09s}
  .grid > *:nth-child(5){animation-delay:.12s} .grid > *:nth-child(6){animation-delay:.15s} .grid > *:nth-child(n+7){animation-delay:.18s}
  .ovl{animation:fade .2s ease both;}
  .sheet{animation:gore .32s cubic-bezier(.2,.9,.25,1) both;}
  .undo{animation:ulaz .25s ease both;}
  .toast{animation:dole .28s cubic-bezier(.2,.8,.2,1) both;}
  .tile{overflow:visible;}
  .tile.hit{animation:skok .32s ease;}
  .tile.hit::after{content:''; position:absolute; left:50%; top:50%; width:90px; height:90px; border-radius:50%;
    background:radial-gradient(circle, rgba(232,163,61,.55), rgba(232,163,61,0) 70%); pointer-events:none; animation:val .5s ease-out forwards;}
  .badge{animation:bump .35s cubic-bezier(.3,1.6,.5,1);}
  .splash svg{animation:puls 1.4s ease-in-out infinite;}
  .card.trening{animation:ulaz .45s .1s cubic-bezier(.2,.8,.2,1) both;}
  .animbroj{font-variant-numeric:tabular-nums;}
  .kvacica circle{--d:190; stroke-dasharray:190; animation:crtaj .6s ease-out both;}
  .kvacica path{--d:50; stroke-dasharray:50; animation:crtaj .4s .45s ease-out both;}
  .savrseno{display:flex; flex-direction:column; align-items:center; text-align:center; padding:22px 16px; border-radius:16px;
    border:1px solid rgba(95,176,122,.5); background:linear-gradient(180deg,rgba(95,176,122,.12),rgba(95,176,122,.02)); animation:sjaj 2.4s ease-in-out 2;}
  .kasa-card.prazno{border-color:rgba(232,163,61,.55);}
  .tile.mala{min-height:76px; padding:12px 11px 10px;}
  .tile.mala .nm{font-size:14px;}
  .tile .minus{padding:4px 10px; border-radius:8px; border:1px solid rgba(229,84,75,.5); color:var(--red); font-size:12px; font-weight:700;}
  .tile:disabled{opacity:.4;}
  .tbadge{display:inline-grid; place-items:center; min-width:19px; height:19px; padding:0 5px; margin-left:6px; border-radius:10px; background:var(--red); color:#fff; font-size:11px; font-weight:700; animation:bump .4s ease;}
  .stub{height:5px; border-radius:3px; background:rgba(255,255,255,.06); margin:7px 0 5px; overflow:hidden}
  .stub i{display:block; height:100%; border-radius:3px; background:var(--goldg); transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .card.sati{display:flex; align-items:flex-end; gap:3px; min-height:104px; padding:14px 12px 10px; overflow-x:auto}
  .stupac{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; flex:1 0 16px}
  .stupac i{display:block; width:100%; max-width:22px; border-radius:4px 4px 0 0; background:var(--goldg)}
  .stupac span{font-size:10px; color:var(--dim)}
  .kolone{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .kol{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-height:64px}
  .kol.on{border-color:var(--gold); background:var(--gold2)}
  .kol .kh{display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:14.5px; margin-bottom:4px}
  .kol .kh span{color:var(--gold); font-size:18px}
  .err.nestalo{animation:puls 1.6s ease-in-out 3}
  .card.greska{animation:ulaz .35s ease both}
  @media (prefers-reduced-motion: reduce){ *, *::before, *::after{animation:none !important; transition:none !important;} }
</style>
</head>
<body>
<div id="root"></div>
<!--APP-->
</body>
</html>
